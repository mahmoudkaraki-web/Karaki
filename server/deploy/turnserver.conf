# coturn for Karaki calls (Ubuntu): copy to /etc/turnserver.conf after the bank demo freeze is lifted.
# It relays call audio and video only when two phones cannot reach each other directly.
# Two values to fill in on the box (see docs/setup-for-mak.md, "TURN for calls"):
#   static-auth-secret  the same long random value as TURN_SECRET in /opt/karaki/server/.env
#   external-ip         the box's public address / its private address (Azure puts the box behind NAT)

listening-port=3478
fingerprint
realm=karaki.besmart-me.com
server-name=karaki.besmart-me.com

# passwords are made by the Karaki server per member and expire (HMAC, coturn's REST scheme)
use-auth-secret
static-auth-secret=PUT_THE_SAME_SECRET_AS_TURN_SECRET_HERE

# Azure: public address / private address of the box (private: run `hostname -I`)
external-ip=20.74.255.57/PRIVATE_ADDRESS_HERE

# the ports the relayed calls use; open the same range in Azure's network settings
min-port=49160
max-port=49200

# keep it small and safe: a family of a few people, no relaying into private networks
total-quota=60
user-quota=12
stale-nonce=600
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=/var/log/turnserver/turnserver.log
simple-log
